<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">How LazNote works</title><desc id="d">Five steps: Pulse, Listen, Sort, Airlock, Surface.</desc><rect width="1200" height="300" rx="20" fill="#0b0d0a"/><rect x="1" y="1" width="1198" height="298" rx="19" fill="none" stroke="#2a3020"/><text x="40" y="40" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#9aa38a" letter-spacing="2">HOW IT WORKS</text><rect x="44" y="64" width="184" height="176" rx="14" fill="#12150f" stroke="#2a3020"/><text x="62" y="98" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#c5ec3a" letter-spacing="2">01</text><text x="62" y="138" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="28" font-weight="700" fill="#f3f5ec">Pulse</text><text x="62" y="170" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#9aa38a">Press and talk, or</text><text x="62" y="194" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#9aa38a">type.</text><path d="M238 152 L266 152 M258 144 L266 152 L258 160" fill="none" stroke="#c5ec3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="276" y="64" width="184" height="176" rx="14" fill="#12150f" stroke="#2a3020"/><text x="294" y="98" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#c5ec3a" letter-spacing="2">02</text><text x="294" y="138" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="28" font-weight="700" fill="#f3f5ec">Listen</text><text x="294" y="170" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#9aa38a">Whisper turns</text><text x="294" y="194" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#9aa38a">speech into text.</text><path d="M470 152 L498 152 M490 144 L498 152 L490 160" fill="none" stroke="#c5ec3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="508" y="64" width="184" height="176" rx="14" fill="#12150f" stroke="#2a3020"/><text x="526" y="98" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#c5ec3a" letter-spacing="2">03</text><text x="526" y="138" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="28" font-weight="700" fill="#f3f5ec">Sort</text><text x="526" y="170" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#9aa38a">An AI model picks</text><text x="526" y="194" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#9aa38a">the stack and</text><text x="526" y="218" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#9aa38a">urgency.</text><path d="M702 152 L730 152 M722 144 L730 152 L722 160" fill="none" stroke="#c5ec3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="740" y="64" width="184" height="176" rx="14" fill="#12150f" stroke="#2a3020"/><text x="758" y="98" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#f5b13a" letter-spacing="2">04</text><text x="758" y="138" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="28" font-weight="700" fill="#f3f5ec">Airlock</text><text x="758" y="170" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#9aa38a">Unsure notes wait</text><text x="758" y="194" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#9aa38a">for one tap.</text><path d="M934 152 L962 152 M954 144 L962 152 L954 160" fill="none" stroke="#c5ec3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="972" y="64" width="184" height="176" rx="14" fill="#12150f" stroke="#2a3020"/><text x="990" y="98" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#c5ec3a" letter-spacing="2">05</text><text x="990" y="138" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="28" font-weight="700" fill="#f3f5ec">Surface</text><text x="990" y="170" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#9aa38a">Notes ranked by</text><text x="990" y="194" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#9aa38a">urgency, not date.</text></svg>