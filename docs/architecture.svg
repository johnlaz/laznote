<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">LazNote architecture</title><desc id="d">The LazNote app runs in your browser and stores notes in IndexedDB. Only Groq API calls and a few CDN files leave the device.</desc><rect width="1200" height="520" rx="20" fill="#0b0d0a"/><rect x="1" y="1" width="1198" height="518" rx="19" fill="none" stroke="#2a3020"/><text x="40" y="38" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#9aa38a" letter-spacing="2">ARCHITECTURE</text><rect x="40" y="60" width="680" height="430" rx="18" fill="none" stroke="#c5ec3a" stroke-opacity=".4" stroke-dasharray="6 6"/><text x="64" y="92" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#c5ec3a" letter-spacing="2">ON YOUR DEVICE</text><rect x="70" y="112" width="300" height="150" rx="14" fill="#12150f" stroke="#c5ec3a" stroke-opacity=".6"/><text x="90" y="148" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="22" font-weight="700" fill="#f3f5ec">LazNote app</text><text x="90" y="180" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#9aa38a">Static PWA on GitHub Pages</text><text x="90" y="206" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#9aa38a">Vanilla JS, no build step</text><text x="90" y="232" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#9aa38a">Lives in the /app folder</text><rect x="400" y="112" width="290" height="150" rx="14" fill="#12150f" stroke="#c5ec3a" stroke-opacity=".6"/><text x="420" y="148" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="22" font-weight="700" fill="#f3f5ec">Service worker</text><text x="420" y="180" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#9aa38a">Caches the app shell</text><text x="420" y="206" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#9aa38a">Notes work offline</text><text x="420" y="232" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#9aa38a">Touches only laznote caches</text><rect x="70" y="292" width="620" height="170" rx="14" fill="#12150f" stroke="#c5ec3a" stroke-opacity=".6"/><text x="90" y="328" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="22" font-weight="700" fill="#f3f5ec">IndexedDB  (database "laznote")</text><text x="90" y="360" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#9aa38a">Notes, stacks and settings</text><text x="90" y="386" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#9aa38a">Your Groq key is kept here, on this device only</text><text x="90" y="412" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#9aa38a">No sync, no server, no account</text><text x="760" y="92" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#f5b13a" letter-spacing="2">THE ONLY OUTSIDE CALLS</text><rect x="760" y="112" width="400" height="170" rx="14" fill="#12150f" stroke="#f5b13a" stroke-opacity=".6"/><text x="780" y="148" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="22" font-weight="700" fill="#f3f5ec">Groq API</text><text x="780" y="180" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#9aa38a">api.groq.com, direct from the browser</text><text x="780" y="206" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#9aa38a">Whisper for voice, a chat model to sort</text><text x="780" y="232" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#9aa38a">Model list refreshed from your key</text><rect x="760" y="312" width="400" height="150" rx="14" fill="#12150f" stroke="#f5b13a" stroke-opacity=".6"/><text x="780" y="348" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="22" font-weight="700" fill="#f3f5ec">CDN files (cached after first use)</text><text x="780" y="380" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#9aa38a">Tesseract.js and html2pdf.js (cdnjs)</text><text x="780" y="406" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#9aa38a">Inter and JetBrains Mono (Google Fonts)</text><path d="M722 197 L750 197 M742 189 L750 197 L742 205" fill="none" stroke="#f5b13a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M722 387 L750 387 M742 379 L750 387 L742 395" fill="none" stroke="#f5b13a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>