<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>LazNote</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#0b0d0a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="LazNote" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app-root">
  <div class="app-shell" id="shell">
    <div class="sb-spacer"></div>

    <!-- ───── Onboarding ───── -->
    <div class="view" data-view="onb">
      <div class="onb-pad">
        <div class="onb-step" id="onb-step">01 / 03</div>
        <h2 class="onb-h" id="onb-h"></h2>
        <p class="onb-p" id="onb-p"></p>
        <div style="flex:1;display:grid;place-items:center;margin:24px 0;" id="onb-art"></div>
        <div id="onb-body"></div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:16px;">
          <div class="dots" id="onb-dots"><span class="on"></span><span></span><span></span></div>
          <button class="btn primary" id="onb-next">Next →</button>
        </div>
      </div>
    </div>

    <!-- ───── Blade view ───── -->
    <div class="view" data-view="blade">
      <div class="topbar" style="padding-top:16px;">
        <div style="flex:1;">
          <div style="font-family:var(--mono);font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-50);display:flex;align-items:center;gap:6px;"><span style="width:6px;height:6px;border-radius:50%;background:var(--lime);animation:pulse 1.8s infinite;"></span><span id="blade-date">Today</span></div>
          <div style="font-size:24px;font-weight:700;letter-spacing:-0.02em;line-height:1.1;margin-top:4px;"><span id="blade-count">0</span> blades. <span style="color:var(--lime);" id="blade-now-count">0</span> need now.</div>
        </div>
        <div class="icon-btn" onclick="LazNote.search()" aria-label="Search"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="9" cy="9" r="5.5"/><path d="M13.5 13.5L17 17"/></svg></div>
      </div>
      <div style="padding:6px 18px 10px;display:flex;gap:12px;overflow-x:auto;border-bottom:1px solid var(--line-2);scrollbar-width:none;white-space:nowrap;" id="stack-tabs"></div>
      <div class="scroll" style="padding:12px 14px 140px;display:flex;flex-direction:column;gap:6px;" id="blade-list"></div>
      <div class="fab-shell"><button class="fab" id="fab-pulse" aria-label="Pulse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0"/><path d="M12 18v3"/></svg></button></div>
      <div class="botnav">
        <div class="nav active" data-go="blade"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 6h14M3 10h14M3 14h10"/></svg>Blades</div>
        <div class="nav" data-go="stacks"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M10 2l7 4-7 4-7-4 7-4z"/><path d="M3 10l7 4 7-4"/></svg>Stacks</div>
        <div></div>
        <div class="nav" data-go="airlock"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 4a3 3 0 00-3 3v1a2 2 0 00-1 3.5A2 2 0 005 15h2v2h6v-2h2a2 2 0 002-3.5A2 2 0 0016 8V7a3 3 0 00-3-3 3 3 0 00-3 0 3 3 0 00-3 0z"/></svg>Airlock</div>
        <div class="nav" data-go="settings"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="2.5"/><path d="M10 2v2M10 16v2M3 10H1M19 10h-2M5 5L3.5 3.5M16.5 16.5L15 15M5 15l-1.5 1.5M16.5 3.5L15 5"/></svg>Settings</div>
      </div>
    </div>

    <!-- ───── Note detail ───── -->
    <div class="view" data-view="note">
      <div class="topbar">
        <div class="icon-btn" data-back><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" width="14" height="14"><path d="M12 5l-5 5 5 5"/></svg></div>
        <h1 id="note-stack">·</h1>
        <div class="icon-btn" onclick="LazNote.deleteCurrentNote()" aria-label="Delete"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" width="14" height="14"><path d="M5 6h10M8 9v6M12 9v6M6 6l1 10h6l1-10M8 6V4h4v2"/></svg></div>
      </div>
      <div class="scroll" style="padding:6px 22px 40px;" id="note-body"></div>
    </div>

    <!-- ───── Stacks ───── -->
    <div class="view" data-view="stacks">
      <div class="topbar">
        <div class="icon-btn" data-back><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" width="14" height="14"><path d="M12 5l-5 5 5 5"/></svg></div>
        <h1>Stacks</h1>
        <div class="icon-btn" onclick="LazNote.addStack()" aria-label="Add stack"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" width="14" height="14"><path d="M10 4v12M4 10h12"/></svg></div>
      </div>
      <div class="scroll" style="padding:6px 14px 24px;" id="stacks-list"></div>
    </div>

    <!-- ───── Airlock ───── -->
    <div class="view" data-view="airlock">
      <div class="topbar">
        <div class="icon-btn" data-back><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" width="14" height="14"><path d="M12 5l-5 5 5 5"/></svg></div>
        <h1>Airlock</h1>
        <div class="spacer"></div>
      </div>
      <div class="scroll" style="padding:6px 14px 24px;" id="airlock-list"></div>
    </div>

    <!-- ───── Settings ───── -->
    <div class="view" data-view="settings">
      <div class="topbar">
        <div class="icon-btn" data-back><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" width="14" height="14"><path d="M12 5l-5 5 5 5"/></svg></div>
        <h1>Settings</h1>
        <div class="spacer"></div>
      </div>
      <div class="scroll" style="padding:0 14px 40px;" id="settings-body"></div>
    </div>

    <!-- ───── Groq detail ───── -->
    <div class="view" data-view="groq">
      <div class="topbar">
        <div class="icon-btn" data-back><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" width="14" height="14"><path d="M12 5l-5 5 5 5"/></svg></div>
        <h1>Groq</h1>
        <div class="spacer"></div>
      </div>
      <div class="scroll" style="padding:0 14px 40px;" id="groq-body"></div>
    </div>

    <!-- ───── Capture sheet (over any view) ───── -->
    <div class="capture-sheet" id="capture">
      <div class="capture-handle"></div>
      <div class="topbar">
        <div class="icon-btn" onclick="LazNote.closeCapture()" aria-label="Close"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" width="14" height="14"><path d="M5 5l10 10M15 5L5 15"/></svg></div>
        <h1>New note</h1>
        <div class="spacer"></div>
      </div>
      <div style="padding:0 22px;flex:1;display:flex;flex-direction:column;">
        <textarea class="input" id="capture-text" placeholder="Speak your mind. AI will sort it into the right stack."></textarea>
        <div style="margin-top:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          <span class="chip" id="capture-stack-hint" style="display:none;"></span>
          <span class="chip" id="capture-due-hint" style="display:none;"></span>
        </div>
        <div style="margin-top:14px;font-family:var(--mono);font-size:10px;letter-spacing:0.14em;color:var(--ink-50);text-transform:uppercase;">Manual stack</div>
        <div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;" id="capture-stack-chips"></div>
        <div style="flex:1;"></div>
        <div style="display:flex;gap:8px;padding:14px 0 calc(20px + env(safe-area-inset-bottom));">
          <button class="btn ghost" onclick="LazNote.saveCapture('raw')">Save raw</button>
          <button class="btn primary" style="flex:1;" id="capture-ai" onclick="LazNote.saveCapture('ai')">
            <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 4a3 3 0 00-3 3v1a2 2 0 00-1 3.5A2 2 0 005 15h2v2h6v-2h2a2 2 0 002-3.5A2 2 0 0016 8V7a3 3 0 00-3-3 3 3 0 00-3 0 3 3 0 00-3 0z"/></svg>
            <span id="capture-ai-label">Sort with AI</span>
          </button>
        </div>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
